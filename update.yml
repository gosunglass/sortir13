name: Mise à jour quotidienne des sorties

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5h UTC (6h ou 7h en France)
  workflow_dispatch:       # lancement manuel possible

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecter et analyser les sorties
        run: python scripts/update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publier les nouvelles données
        run: |
          git config user.name "sorties13-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour quotidienne des sorties"
            git push
          fi
